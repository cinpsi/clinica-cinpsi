<style>
/* Layout: coluna única de 560px, uma etapa por tela, botões de resposta em 3 colunas, tudo pensado para polegar. */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --fg:#292A2D; --muted:#5A5E66;
  --primary:#04253D; --on-primary:#FFFFFF; --sky:#9BC8E0; --sky-soft:#E3EFF6;
  --teal:#276265; --gold:#B2680E; --line:#DDD8D0; --focus:#1B6FA8;
  --warn:#9A3412; --warn-soft:#FBEADF;
  --font-display:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --surface:#152330; --fg:#ECE9E4; --muted:#A3ABB4;
    --primary:#9BC8E0; --on-primary:#04253D; --sky-soft:#1D3344;
    --teal:#6FB7B0; --gold:#E0A050; --line:#2B3C4B; --focus:#9BC8E0;
    --warn:#F2A97B; --warn-soft:#3A2418; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1822; --surface:#152330; --fg:#ECE9E4; --muted:#A3ABB4;
  --primary:#9BC8E0; --on-primary:#04253D; --sky-soft:#1D3344;
  --teal:#6FB7B0; --gold:#E0A050; --line:#2B3C4B; --focus:#9BC8E0;
  --warn:#F2A97B; --warn-soft:#3A2418; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 32px;
}
.app{max-width:560px; margin:0 auto}
h1,h2{font-family:var(--font-display); color:var(--primary); text-wrap:balance; margin:0}
h1{font-size:24px; line-height:1.2; font-weight:700; margin-top:20px}
h2{font-size:16px; font-weight:600; margin:24px 0 10px}
p{margin:0}
.lead{margin-top:10px; color:var(--muted)}

.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding:12px 0 10px; border-bottom:1px solid var(--line)}
.top-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.brand{font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.14em; color:var(--primary)}
.stat{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right}
.bar{height:6px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--teal); border-radius:3px; transition:width .25s}

.logo{display:flex; justify-content:center; margin-top:20px}
.logo img{display:block; width:min(280px, 78%); height:auto; border-radius:14px}
.logo-dark{display:none!important}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-light{display:none!important}
  :root:not([data-theme="light"]) .logo-dark{display:block!important}
}
:root[data-theme="dark"] .logo-light{display:none!important}
:root[data-theme="dark"] .logo-dark{display:block!important}
.doc p + p{margin-top:12px}
.hint{font-size:13px; color:var(--muted)}
.how{background:var(--sky-soft); border-radius:12px; padding:14px; margin-top:16px; font-size:15px}
.how ul{margin:8px 0 0; padding:0; list-style:none; display:grid; gap:6px}
.how li{display:flex; gap:10px; align-items:baseline}
.how b{font-family:var(--font-display); min-width:1.2em; color:var(--primary)}

.field{display:grid; gap:6px; margin-bottom:14px}
.field label{font-weight:600; font-size:14px}
.field input,.field select{
  font:inherit; font-size:16px; min-height:48px; padding:0 12px; width:100%;
  background:var(--surface); color:var(--fg); border:1.5px solid var(--line); border-radius:10px;
}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--warn)}
.field input:focus-visible,.field select:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.item{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 12px 12px; margin-top:12px; scroll-margin-top:96px}
.item.missing{border-color:var(--warn); background:var(--warn-soft)}
.item .n{font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--teal); text-transform:uppercase}
.item.done .n::after{content:" ✓"}
.item .q{font-size:16px; line-height:1.45; margin-top:4px}
.choices{display:grid; grid-template-columns:repeat(var(--cols,3), minmax(0,1fr)); gap:8px; margin-top:12px}
.choices label{position:relative; display:block; min-width:0}
.choices input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.opt{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:66px; padding:6px 2px;
  border:1.5px solid var(--line); border-radius:10px; background:var(--bg); text-align:center; pointer-events:none;
}
.opt b{font-family:var(--font-display); font-size:20px; line-height:1.1}
.opt span{font-size:10.5px; line-height:1.2; color:var(--muted); max-width:100%; overflow-wrap:break-word; hyphens:auto; -webkit-hyphens:auto; letter-spacing:-.01em}
@media (max-width:360px){ .opt span{font-size:9.5px} }
/* 4 ou mais opções: lista vertical, um botão por linha (cabe em qualquer tela) */
.choices.many{grid-template-columns:1fr; gap:6px}
.choices.many .opt{flex-direction:row; justify-content:flex-start; gap:12px; min-height:48px; padding:6px 14px; text-align:left}
.choices.many .opt b{min-width:1.2em; text-align:center}
.choices.many .opt span{font-size:14px; color:inherit; letter-spacing:0}
.choices input:checked + .opt{background:var(--primary); color:var(--on-primary); border-color:var(--primary)}
.choices input:checked + .opt span{color:inherit}
.choices input:checked + .opt b::after{content:" ✓"; font-size:14px}
.choices input:focus-visible + .opt{outline:3px solid var(--focus); outline-offset:2px}

.msg{min-height:1.4em; margin-top:14px; font-size:14px; color:var(--warn); font-weight:600}
.nav{display:flex; gap:10px; margin-top:8px}
.nav .btn{flex:1}
.btn{
  display:flex; align-items:center; justify-content:center; text-align:center; text-decoration:none; cursor:pointer;
  font-family:var(--font-display); font-weight:600; font-size:16px; min-height:52px; padding:0 18px;
  border-radius:12px; border:1.5px solid var(--primary); background:var(--primary); color:var(--on-primary);
}
.btn.ghost{background:transparent; color:var(--primary)}
.btn.block{width:100%}
.stack{display:grid; gap:10px; margin-top:16px}

.counts{display:grid; grid-template-columns:repeat(auto-fit, minmax(84px,1fr)); gap:8px; margin-top:12px}
.counts div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center}
.counts b{display:block; font-family:var(--font-display); font-size:24px; font-variant-numeric:tabular-nums; color:var(--primary)}
.counts span{font-size:12px; color:var(--muted)}
.jump{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.jump button{font:inherit; font-size:14px; min-height:40px; padding:0 14px; border-radius:20px; border:1.5px solid var(--warn); background:var(--warn-soft); color:var(--warn); cursor:pointer; font-weight:600}
textarea{width:100%; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.5; padding:12px; min-height:220px; background:var(--surface); color:var(--fg); border:1.5px solid var(--line); border-radius:10px; resize:vertical}
.note{font-size:13px; color:var(--muted); margin-top:12px}
.ok{color:var(--teal); font-weight:600; min-height:1.4em; font-size:14px; margin-top:8px}
.foot{margin-top:28px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

  function enviar(){
    var payload = { codigo:CODE, escala:ESC, versao:'v1',
      crianca:{ nome:clean(S.id.nome), nasc:parseBR(S.id.nasc), sexo:S.id.sexo, serie:clean(S.id.serie) },
      informante:{ nome:clean(S.id.informante), relacao:relacaoTxt(), data:parseBR(S.id.data) },
      respostas:S.ans.join(''), codigoNeuro:buildCode() };
    var body = { fields:{
      escala:{stringValue:ESC}, dados:{stringValue:JSON.stringify(payload)}, enviadoEm:{stringValue:new Date().toISOString()} } };
    return fetch(API + FB_KEY + '&documentId=' + encodeURIComponent(CODE), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
      .then(function(r){ if(!r.ok){ var e = new Error('http ' + r.status); e.status = r.status; throw e; } return r.json(); });
  }

  function renderDone(){
    var msg = buildMessage();
    var sent = !!S.sent;
    main.innerHTML =
      logoHTML() +
      '<h1>' + (sent ? 'Respostas enviadas' : 'Falta só enviar') + '</h1>' +
      '<p class="lead">' + (sent ? 'Obrigado, ' + esc(clean(S.id.informante).split(' ')[0] || '') + '. Recebemos as respostas e a equipe do CINPSI dará sequência. Você já pode fechar esta página.' :
        'Obrigado, ' + esc(clean(S.id.informante).split(' ')[0] || '') + '. Toque em enviar para entregar as respostas à equipe do CINPSI.') + '</p>' +
      (sent ? '' : '<div class="stack"><button class="btn block" id="send" type="button">Enviar respostas</button></div>') +
      '<p class="ok" id="ok" role="status"></p>' +
      '<p class="msg" id="err" role="alert"></p>' +
      '<div id="alt" ' + (S.fail ? '' : 'hidden') + '>' +
        '<p class="note">Não foi possível enviar agora. Você pode mandar pelo WhatsApp do CINPSI:</p>' +
        '<div class="stack"><a class="btn block" href="https://wa.me/' + CLINIC_WHATSAPP + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>' +
        '<button class="btn ghost block" id="copy" type="button">Copiar respostas</button></div>' +
        '<textarea id="out" readonly aria-label="Respostas em texto" style="margin-top:12px">' + esc(msg) + '</textarea></div>' +
      (sent ? '' : '<div class="stack"><button class="btn ghost block" id="edit" type="button">Revisar respostas</button></div>');
    var ok = document.getElementById('ok'), err = document.getElementById('err');
    var send = document.getElementById('send');
    if (send) send.addEventListener('click', function(){
      if (!CODE) { err.textContent = 'Link inválido. Peça um novo link à clínica.'; return; }
      send.disabled = true; send.textContent = 'Enviando...'; err.textContent = '';
      enviar().then(function(){ S.sent = true; S.fail = false; save(); render(); window.scrollTo(0,0); },
        function(e){ send.disabled = false; send.textContent = 'Tentar enviar de novo';
          if (e && (e.status === 403 || e.status === 409)) { err.textContent = 'Este link não está mais ativo ou já foi respondido. Peça um novo link à clínica.'; return; }
          S.fail = true; save(); err.textContent = 'Não conseguimos enviar. Verifique a internet e tente de novo.'; document.getElementById('alt').hidden = false; });
    });
    var copy = document.getElementById('copy');
    if (copy) copy.addEventListener('click', function(){
      var out = document.getElementById('out');
      function fallback(){ out.focus(); out.select(); ok.textContent = 'Selecione o texto abaixo e copie.'; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(function(){ ok.textContent = 'Texto copiado.'; }, fallback); else fallback();
    });
    var ed = document.getElementById('edit');
    if (ed) ed.addEventListener('click', function(){ go(REVIEW); });
  }

  function render(){
    main.onchange = null;
    updateTop();
    if (S.done) renderDone();
    else if (S.page === 0) renderIntro();
    else if (S.page === 1) renderIdent();
    else if (S.page === REVIEW) renderReview();
    else renderItems();
  }
  if (!CODE) { main.innerHTML = '<h1>Link inválido</h1><p class="lead">Este link está incompleto. Peça um novo link à equipe do CINPSI.</p>'; return; }
  render();
})();
</script>
</body></html>
